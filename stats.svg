<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="rowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="rowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="rowGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="rowGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0020"/>
      <stop offset="100%" stop-color="#0d0015"/>
    </linearGradient>

    <style>
      @keyframes fillRing {
        0% { stroke-dasharray: 0 251; }
        100% { stroke-dasharray: 200 251; }
      }
      @keyframes slideRow {
        0% { transform: translateX(-30px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes countUp {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      .ring-fill {
        animation: fillRing 2s ease-out 0.5s forwards;
      }
      .row-1 { animation: slideRow 0.5s ease-out 0.8s both; }
      .row-2 { animation: slideRow 0.5s ease-out 1.1s both; }
      .row-3 { animation: slideRow 0.5s ease-out 1.4s both; }
      .row-4 { animation: slideRow 0.5s ease-out 1.7s both; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="220" rx="16" fill="url(#bgGrad)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>

  <!-- Rank Ring -->
  <g transform="translate(70,110)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#374151" stroke-width="8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" transform="rotate(-90)" class="ring-fill" style="stroke-dasharray:0 251"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-family="'Georgia',serif" font-size="18" font-weight="bold">
      <animate attributeName="opacity" values="0;1" begin="2.5s" dur="0.5s" fill="freeze"/>
      A
    </text>
    <text x="0" y="12" text-anchor="middle" fill="#a78bfa" font-family="'Fira Code',monospace" font-size="8" class="fade-in" style="animation-delay:2.8s">
      RANK
    </text>
  </g>

  <!-- Stat Rows -->
  <g transform="translate(140,20)" font-family="'Inter',sans-serif">
    <!-- Public Repos -->
    <g class="row-1">
      <text x="0" y="18" fill="#9ca3af" font-size="12">Public Repos</text>
      <text x="230" y="18" fill="#f472b6" font-family="'Fira Code',monospace" font-size="13" font-weight="bold">
        20+
        <animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.3s" fill="freeze"/>
      </text>
      <rect x="0" y="25" width="230" height="4" rx="2" fill="#374151"/>
      <rect x="0" y="25" width="200" height="4" rx="2" fill="url(#rowGrad1)">
        <animate attributeName="width" values="0;200" begin="1.3s" dur="0.6s" fill="freeze"/>
      </rect>
    </g>

    <!-- Stars -->
    <g class="row-2">
      <text x="0" y="55" fill="#9ca3af" font-size="12">Stars Earned</text>
      <text x="230" y="55" fill="#c084fc" font-family="'Fira Code',monospace" font-size="13" font-weight="bold">
        10+
        <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.3s" fill="freeze"/>
      </text>
      <rect x="0" y="62" width="230" height="4" rx="2" fill="#374151"/>
      <rect x="0" y="62" width="160" height="4" rx="2" fill="url(#rowGrad2)">
        <animate attributeName="width" values="0;160" begin="1.6s" dur="0.6s" fill="freeze"/>
      </rect>
    </g>

    <!-- Followers -->
    <g class="row-3">
      <text x="0" y="92" fill="#9ca3af" font-size="12">Followers</text>
      <text x="230" y="92" fill="#818cf8" font-family="'Fira Code',monospace" font-size="13" font-weight="bold">
        15+
        <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.3s" fill="freeze"/>
      </text>
      <rect x="0" y="99" width="230" height="4" rx="2" fill="#374151"/>
      <rect x="0" y="99" width="140" height="4" rx="2" fill="url(#rowGrad3)">
        <animate attributeName="width" values="0;140" begin="1.9s" dur="0.6s" fill="freeze"/>
      </rect>
    </g>

    <!-- Following -->
    <g class="row-4">
      <text x="0" y="129" fill="#9ca3af" font-size="12">Following</text>
      <text x="230" y="129" fill="#22d3ee" font-family="'Fira Code',monospace" font-size="13" font-weight="bold">
        5
        <animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.3s" fill="freeze"/>
      </text>
      <rect x="0" y="136" width="230" height="4" rx="2" fill="#374151"/>
      <rect x="0" y="136" width="80" height="4" rx="2" fill="url(#rowGrad4)">
        <animate attributeName="width" values="0;80" begin="2.2s" dur="0.6s" fill="freeze"/>
      </rect>
    </g>

    <!-- Total Contributions label -->
    <text x="0" y="175" fill="#6b7280" font-family="'Fira Code',monospace" font-size="9" class="fade-in" style="animation-delay:2.5s">
      Total Contributions: 500+
    </text>
  </g>
</svg>
