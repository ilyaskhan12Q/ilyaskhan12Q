name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color=#ff69b4&bg=#0d0015
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color=#a855f7&bg=#0d0015
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color=#ec4899&bg=#fdf2f8

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
