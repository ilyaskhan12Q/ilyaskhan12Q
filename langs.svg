<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0020"/>
      <stop offset="100%" stop-color="#0d0015"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#306998"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="100%" stop-color="#235a97"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="100%" stop-color="#e6c41a"/>
    </linearGradient>
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00599c"/>
      <stop offset="100%" stop-color="#004482"/>
    </linearGradient>
    <linearGradient id="dartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2b8"/>
      <stop offset="100%" stop-color="#0175c2"/>
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e34f26"/>
      <stop offset="100%" stop-color="#c43a1a"/>
    </linearGradient>

    <style>
      @keyframes fillBar {
        0% { width: 0; }
        100% { width: var(--w); }
      }
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(168,85,247,0.3)); }
        50% { filter: drop-shadow(0 0 12px rgba(168,85,247,0.6)); }
      }
      .bar-1 { --w: 180px; animation: fillBar 1.2s ease-out 0.5s both; }
      .bar-2 { --w: 150px; animation: fillBar 1.2s ease-out 0.7s both; }
      .bar-3 { --w: 130px; animation: fillBar 1.2s ease-out 0.9s both; }
      .bar-4 { --w: 100px; animation: fillBar 1.2s ease-out 1.1s both; }
      .bar-5 { --w: 85px;  animation: fillBar 1.2s ease-out 1.3s both; }
      .bar-6 { --w: 70px;  animation: fillBar 1.2s ease-out 1.5s both; }
      .lang-row { animation: fadeIn 0.5s ease-out both; }
      .glow-title { animation: glowPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="260" rx="16" fill="url(#bgGrad)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="#a78bfa" font-family="'Fira Code',monospace" font-size="12" font-weight="bold" class="glow-title">
    &lt;/&gt; TOP LANGUAGES
  </text>

  <!-- Language Bars -->
  <g transform="translate(30,55)" font-family="'Inter',sans-serif">
    <!-- Python -->
    <g class="lang-row" style="animation-delay:0.4s">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#306998"/>
      <text x="24" y="13" fill="#d1d5db" font-size="12" font-weight="600">Python</text>
      <text x="310" y="13" fill="#306998" font-family="'Fira Code',monospace" font-size="11" text-anchor="end">36%</text>
      <rect x="0" y="22" width="340" height="8" rx="4" fill="#374151"/>
      <rect x="0" y="22" height="8" rx="4" fill="url(#pyGrad)" class="bar-1"/>
    </g>

    <!-- TypeScript -->
    <g class="lang-row" style="animation-delay:0.6s">
      <rect x="0" y="40" width="16" height="16" rx="3" fill="#3178c6"/>
      <text x="24" y="53" fill="#d1d5db" font-size="12" font-weight="600">TypeScript</text>
      <text x="310" y="53" fill="#3178c6" font-family="'Fira Code',monospace" font-size="11" text-anchor="end">30%</text>
      <rect x="0" y="62" width="340" height="8" rx="4" fill="#374151"/>
      <rect x="0" y="62" height="8" rx="4" fill="url(#tsGrad)" class="bar-2"/>
    </g>

    <!-- JavaScript -->
    <g class="lang-row" style="animation-delay:0.8s">
      <rect x="0" y="80" width="16" height="16" rx="3" fill="#f7df1e"/>
      <text x="24" y="93" fill="#d1d5db" font-size="12" font-weight="600">JavaScript</text>
      <text x="310" y="93" fill="#f7df1e" font-family="'Fira Code',monospace" font-size="11" text-anchor="end">25%</text>
      <rect x="0" y="102" width="340" height="8" rx="4" fill="#374151"/>
      <rect x="0" y="102" height="8" rx="4" fill="url(#jsGrad)" class="bar-3"/>
    </g>

    <!-- C++ -->
    <g class="lang-row" style="animation-delay:1s">
      <rect x="0" y="120" width="16" height="16" rx="3" fill="#00599c"/>
      <text x="24" y="133" fill="#d1d5db" font-size="12" font-weight="600">C++</text>
      <text x="310" y="133" fill="#00599c" font-family="'Fira Code',monospace" font-size="11" text-anchor="end">20%</text>
      <rect x="0" y="142" width="340" height="8" rx="4" fill="#374151"/>
      <rect x="0" y="142" height="8" rx="4" fill="url(#cppGrad)" class="bar-4"/>
    </g>

    <!-- Dart -->
    <g class="lang-row" style="animation-delay:1.2s">
      <rect x="0" y="160" width="16" height="16" rx="3" fill="#00d2b8"/>
      <text x="24" y="173" fill="#d1d5db" font-size="12" font-weight="600">Dart / Flutter</text>
      <text x="310" y="173" fill="#00d2b8" font-family="'Fira Code',monospace" font-size="11" text-anchor="end">17%</text>
      <rect x="0" y="182" width="340" height="8" rx="4" fill="#374151"/>
      <rect x="0" y="182" height="8" rx="4" fill="url(#dartGrad)" class="bar-5"/>
    </g>

    <!-- HTML/CSS -->
    <g class="lang-row" style="animation-delay:1.4s">
      <rect x="0" y="200" width="16" height="16" rx="3" fill="#e34f26"/>
      <text x="24" y="213" fill="#d1d5db" font-size="12" font-weight="600">HTML / CSS</text>
      <text x="310" y="213" fill="#e34f26" font-family="'Fira Code',monospace" font-size="11" text-anchor="end">14%</text>
      <rect x="0" y="222" width="340" height="8" rx="4" fill="#374151"/>
      <rect x="0" y="222" height="8" rx="4" fill="url(#htmlGrad)" class="bar-6"/>
    </g>
  </g>
</svg>
