<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0020"/>
      <stop offset="100%" stop-color="#0d0015"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <style>
      @keyframes popIn {
        0% { transform: scale(0) rotate(-15deg); opacity: 0; }
        60% { transform: scale(1.15) rotate(3deg); }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(251,191,36,0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(251,191,36,0.8)); }
      }
      @keyframes shineSweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
      @keyframes fadeRank {
        0% { opacity: 0; transform: translateY(-5px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .trophy-cell {
        animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .trophy-cell:hover {
        filter: drop-shadow(0 0 16px rgba(168,85,247,0.6));
        transition: filter 0.3s ease;
      }
      .shine-sweep {
        animation: shineSweep 3s ease-in-out 2s infinite;
      }
      .rank-glow {
        animation: glowPulse 2s ease-in-out infinite;
      }
      .rank-text {
        animation: fadeRank 0.3s ease-out both;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="540" height="140" rx="16" fill="url(#bgGrad)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>

  <!-- Trophy 1 - Gold -->
  <g class="trophy-cell" style="animation-delay:0.3s">
    <g transform="translate(45,40)">
      <!-- Trophy glow -->
      <circle cx="0" cy="-5" r="30" fill="#fbbf24" opacity="0.08" class="rank-glow"/>
      <!-- Trophy cup -->
      <path d="M-12,-15 L-15,-10 Q-15,-5 -10,-3 L-8,-2 L-8,0 Q-8,8 0,12 Q8,8 8,0 L8,-2 L10,-3 Q15,-5 15,-10 L12,-15Z" fill="url(#goldGrad)" stroke="#d97706" stroke-width="0.5"/>
      <path d="M-6,-14 L-4,-18 L4,-18 L6,-14Z" fill="url(#goldGrad)" stroke="#d97706" stroke-width="0.5"/>
      <rect x="-2" y="10" width="4" height="6" rx="2" fill="url(#goldGrad)"/>
      <rect x="-6" y="15" width="12" height="3" rx="1.5" fill="url(#goldGrad)"/>
      <!-- Rank -->
      <text x="0" y="50" text-anchor="middle" fill="#fbbf24" font-family="'Georgia',serif" font-size="13" font-weight="bold" class="rank-text" style="animation-delay:0.8s">1st</text>
      <text x="0" y="63" text-anchor="middle" fill="#d4d4d8" font-family="'Inter',sans-serif" font-size="8">Commits</text>
    </g>
  </g>

  <!-- Trophy 2 - Silver -->
  <g class="trophy-cell" style="animation-delay:0.6s">
    <g transform="translate(135,40)">
      <circle cx="0" cy="-5" r="30" fill="#94a3b8" opacity="0.08" class="rank-glow"/>
      <path d="M-12,-15 L-15,-10 Q-15,-5 -10,-3 L-8,-2 L-8,0 Q-8,8 0,12 Q8,8 8,0 L8,-2 L10,-3 Q15,-5 15,-10 L12,-15Z" fill="url(#silverGrad)" stroke="#64748b" stroke-width="0.5"/>
      <path d="M-6,-14 L-4,-18 L4,-18 L6,-14Z" fill="url(#silverGrad)" stroke="#64748b" stroke-width="0.5"/>
      <rect x="-2" y="10" width="4" height="6" rx="2" fill="url(#silverGrad)"/>
      <rect x="-6" y="15" width="12" height="3" rx="1.5" fill="url(#silverGrad)"/>
      <text x="0" y="50" text-anchor="middle" fill="#e2e8f0" font-family="'Georgia',serif" font-size="13" font-weight="bold" class="rank-text" style="animation-delay:1.1s">2nd</text>
      <text x="0" y="63" text-anchor="middle" fill="#d4d4d8" font-family="'Inter',sans-serif" font-size="8">PRs</text>
    </g>
  </g>

  <!-- Trophy 3 - Bronze -->
  <g class="trophy-cell" style="animation-delay:0.9s">
    <g transform="translate(225,40)">
      <circle cx="0" cy="-5" r="30" fill="#d97706" opacity="0.08" class="rank-glow"/>
      <path d="M-12,-15 L-15,-10 Q-15,-5 -10,-3 L-8,-2 L-8,0 Q-8,8 0,12 Q8,8 8,0 L8,-2 L10,-3 Q15,-5 15,-10 L12,-15Z" fill="url(#bronzeGrad)" stroke="#92400e" stroke-width="0.5"/>
      <path d="M-6,-14 L-4,-18 L4,-18 L6,-14Z" fill="url(#bronzeGrad)" stroke="#92400e" stroke-width="0.5"/>
      <rect x="-2" y="10" width="4" height="6" rx="2" fill="url(#bronzeGrad)"/>
      <rect x="-6" y="15" width="12" height="3" rx="1.5" fill="url(#bronzeGrad)"/>
      <text x="0" y="50" text-anchor="middle" fill="#d97706" font-family="'Georgia',serif" font-size="13" font-weight="bold" class="rank-text" style="animation-delay:1.4s">3rd</text>
      <text x="0" y="63" text-anchor="middle" fill="#d4d4d8" font-family="'Inter',sans-serif" font-size="8">Issues</text>
    </g>
  </g>

  <!-- Trophy 4 - Blue -->
  <g class="trophy-cell" style="animation-delay:1.2s">
    <g transform="translate(315,40)">
      <circle cx="0" cy="-5" r="30" fill="#38bdf8" opacity="0.08" class="rank-glow"/>
      <path d="M-12,-15 L-15,-10 Q-15,-5 -10,-3 L-8,-2 L-8,0 Q-8,8 0,12 Q8,8 8,0 L8,-2 L10,-3 Q15,-5 15,-10 L12,-15Z" fill="url(#blueGrad)" stroke="#0284c7" stroke-width="0.5"/>
      <path d="M-6,-14 L-4,-18 L4,-18 L6,-14Z" fill="url(#blueGrad)" stroke="#0284c7" stroke-width="0.5"/>
      <rect x="-2" y="10" width="4" height="6" rx="2" fill="url(#blueGrad)"/>
      <rect x="-6" y="15" width="12" height="3" rx="1.5" fill="url(#blueGrad)"/>
      <text x="0" y="50" text-anchor="middle" fill="#38bdf8" font-family="'Georgia',serif" font-size="13" font-weight="bold" class="rank-text" style="animation-delay:1.7s">S</text>
      <text x="0" y="63" text-anchor="middle" fill="#d4d4d8" font-family="'Inter',sans-serif" font-size="8">Speed</text>
    </g>
  </g>

  <!-- Trophy 5 - Purple -->
  <g class="trophy-cell" style="animation-delay:1.5s">
    <g transform="translate(405,40)">
      <circle cx="0" cy="-5" r="30" fill="#a855f7" opacity="0.08" class="rank-glow"/>
      <path d="M-12,-15 L-15,-10 Q-15,-5 -10,-3 L-8,-2 L-8,0 Q-8,8 0,12 Q8,8 8,0 L8,-2 L10,-3 Q15,-5 15,-10 L12,-15Z" fill="url(#purpleGrad)" stroke="#7c3aed" stroke-width="0.5"/>
      <path d="M-6,-14 L-4,-18 L4,-18 L6,-14Z" fill="url(#purpleGrad)" stroke="#7c3aed" stroke-width="0.5"/>
      <rect x="-2" y="10" width="4" height="6" rx="2" fill="url(#purpleGrad)"/>
      <rect x="-6" y="15" width="12" height="3" rx="1.5" fill="url(#purpleGrad)"/>
      <text x="0" y="50" text-anchor="middle" fill="#a855f7" font-family="'Georgia',serif" font-size="13" font-weight="bold" class="rank-text" style="animation-delay:2s">A</text>
      <text x="0" y="63" text-anchor="middle" fill="#d4d4d8" font-family="'Inter',sans-serif" font-size="8">Activity</text>
    </g>
  </g>

  <!-- Trophy 6 - Pink -->
  <g class="trophy-cell" style="animation-delay:1.8s">
    <g transform="translate(495,40)">
      <circle cx="0" cy="-5" r="30" fill="#f472b6" opacity="0.08" class="rank-glow"/>
      <path d="M-12,-15 L-15,-10 Q-15,-5 -10,-3 L-8,-2 L-8,0 Q-8,8 0,12 Q8,8 8,0 L8,-2 L10,-3 Q15,-5 15,-10 L12,-15Z" fill="url(#pinkGrad)" stroke="#db2777" stroke-width="0.5"/>
      <path d="M-6,-14 L-4,-18 L4,-18 L6,-14Z" fill="url(#pinkGrad)" stroke="#db2777" stroke-width="0.5"/>
      <rect x="-2" y="10" width="4" height="6" rx="2" fill="url(#pinkGrad)"/>
      <rect x="-6" y="15" width="12" height="3" rx="1.5" fill="url(#pinkGrad)"/>
      <text x="0" y="50" text-anchor="middle" fill="#f472b6" font-family="'Georgia',serif" font-size="13" font-weight="bold" class="rank-text" style="animation-delay:2.3s">★</text>
      <text x="0" y="63" text-anchor="middle" fill="#d4d4d8" font-family="'Inter',sans-serif" font-size="8">Streak</text>
    </g>
  </g>

  <!-- Shine sweep overlay -->
  <rect x="0" y="0" width="540" height="140" rx="16" fill="url(#shineGrad)" class="shine-sweep"/>
</svg>
